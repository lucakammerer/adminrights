<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AdminRights · runs</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f8fa; --line: #d0d7de; --text: #1f2328; --muted: #656d76;
    --green: #1a7f37; --red: #cf222e; --amber: #9a6700; --blue: #0969da; --gray: #8c959f;
    --green-bg: #dafbe1; --red-bg: #ffebe9; --amber-bg: #fff8c5; --blue-bg: #ddf4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --line: #30363d; --text: #e6edf3; --muted: #8d96a0;
      --green: #3fb950; --red: #f85149; --amber: #d29922; --blue: #4493f8; --gray: #6e7681;
      --green-bg: #12261e; --red-bg: #25171c; --amber-bg: #272115; --blue-bg: #121d2f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 16px 0; }
  .stat { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); }
  .stat b { display: block; font-size: 22px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }

  .trend { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin-bottom: 16px; }
  .trend svg { display: block; width: 100%; height: 72px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
  .toolbar input, .toolbar select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; font: inherit; }
  .toolbar input { flex: 1; }

  .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .list-head { background: var(--panel); padding: 10px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
  .run { border-bottom: 1px solid var(--line); }
  .run:last-child { border-bottom: 0; }
  .row { display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; padding: 12px 16px; cursor: pointer;
    align-items: center; }
  .row:hover { background: var(--panel); }
  .title { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .metrics { display: flex; gap: 14px; align-items: center; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .pill { border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.red { background: var(--red-bg); color: var(--red); }
  .pill.amber { background: var(--amber-bg); color: var(--amber); }
  .pill.blue { background: var(--blue-bg); color: var(--blue); }
  .pill.gray { border: 1px solid var(--line); color: var(--muted); font-weight: 500; }

  .icon { width: 18px; height: 18px; }
  .spin { animation: spin 1s linear infinite; transform-origin: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .details { display: none; padding: 4px 16px 16px 52px; }
  .run.open .details { display: block; }
  .details a { color: var(--blue); }
  .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 4px 0 12px; font-size: 12px; }
  .error { background: var(--red-bg); color: var(--red); border-radius: 6px; padding: 8px 10px; margin-bottom: 12px;
    font-size: 12px; }
  table { border-collapse: collapse; font-size: 12px; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; text-align: left; }
  th { background: var(--panel); font-weight: 600; }
  td.ok { background: var(--green-bg); }
  td.miss { background: var(--red-bg); }
  .tables { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .empty { padding: 24px 16px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>AdminRights · runs</h1>
    <span class="muted" id="updated">loading…</span>
  </header>

  <section class="stats" id="stats"></section>

  <section class="trend">
    <div class="meta">Quality of finished runs, oldest → newest (green: eligible bid, gray: no answer)</div>
    <svg id="trend" viewBox="0 0 1000 72" preserveAspectRatio="none"></svg>
  </section>

  <div class="toolbar">
    <input id="filter" placeholder="Filter by branch, run id or error">
    <select id="kind">
      <option value="">All runs</option>
      <option value="rehearsal">Test runs</option>
      <option value="scored">Scored runs</option>
    </select>
  </div>

  <section class="list">
    <div class="list-head" id="count"></div>
    <div id="runs"></div>
  </section>
</main>

<script>
const FIELDS = ["material_number", "quantity", "base_unit_price", "surcharge_per_unit", "packaging_per_unit",
  "rebate_total", "unit_price", "lead_time_weeks"];
const ICONS = {
  queued: '<svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--amber)" stroke-width="2"/><circle cx="8" cy="8" r="2" fill="var(--amber)"/></svg>',
  running: '<svg class="icon spin" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M8 2a6 6 0 0 1 6 6" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"/></svg>',
  success: '<svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="var(--green)"/><path d="M4.5 8.2l2.2 2.2 4.8-4.8" fill="none" stroke="#fff" stroke-width="1.8"/></svg>',
  warning: '<svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="var(--amber)"/><path d="M8 4v5M8 11.5v.5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>',
  failure: '<svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="var(--red)"/><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" stroke="#fff" stroke-width="1.8"/></svg>',
  cancelled: '<svg class="icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="var(--gray)" stroke-width="2"/><path d="M4 12L12 4" stroke="var(--gray)" stroke-width="2"/></svg>',
};

let runs = [];
const open = new Set();
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dollars = (micro) => `$${(micro / 1e6).toFixed(3)}`;

function state(run) {
  if (!run.finished_at) return run.started_at ? "running" : "queued";
  if (run.status === "cancelled") return "cancelled";
  if (!run.has_answer || !run.score) return "failure";
  return run.score.eligible && run.score.quality >= 50 ? "success" : "warning";
}

function seconds(run) {
  if (run.score) return run.score.duration_ms / 1000;
  if (!run.started_at) return 0;
  return ((run.finished_at || Date.now()) - run.started_at) / 1000;
}

function clock(s) {
  const m = Math.floor(s / 60);
  return `${m}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
}

function ago(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return "just now";
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return new Date(ms).toLocaleString();
}

function renderStats() {
  const active = runs.filter((r) => !r.finished_at);
  const done = runs.filter((r) => r.finished_at);
  const scored = done.filter((r) => r.has_answer && r.score);
  const best = scored.reduce((b, r) => (!b || r.score.quality > b.score.quality ? r : b), null);
  const answered = done.length ? Math.round((100 * scored.length) / done.length) : 0;
  const avg = scored.length ? scored.reduce((a, r) => a + seconds(r), 0) / scored.length : 0;
  const stats = [
    [active.filter((r) => r.started_at).length, "running"],
    [active.filter((r) => !r.started_at).length, "queued"],
    [`${scored.length} / ${done.length}`, `answered (${answered} %)`],
    [best ? best.score.quality : "–", best ? `best quality · ${esc(best.label || best.run_id.slice(4, 12))}` : "best quality"],
    [scored.length ? clock(avg) : "–", "avg time when answered"],
    [dollars(done.reduce((a, r) => a + r.cost_micro_usd, 0)), "total cost"],
  ];
  document.getElementById("stats").innerHTML = stats
    .map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

function renderTrend() {
  const done = runs.filter((r) => r.finished_at && r.status !== "cancelled").reverse();
  const w = 1000 / Math.max(done.length, 12);
  document.getElementById("trend").innerHTML = done.map((r, i) => {
    const q = r.has_answer && r.score ? r.score.quality : 0;
    const h = Math.max(3, (q / 100) * 68);
    const color = !r.has_answer ? "var(--gray)" : r.score?.eligible ? "var(--green)" : "var(--amber)";
    return `<rect x="${i * w + 2}" y="${70 - h}" width="${w - 4}" height="${h}" rx="2" fill="${color}">
      <title>${esc(r.label || r.run_id)}: ${q}</title></rect>`;
  }).join("") + '<line x1="0" y1="70.5" x2="1000" y2="70.5" stroke="var(--line)"/>';
}

function breakdown(run) {
  const b = run.has_answer && run.score?.breakdown;
  if (!b) return "";
  const cell = (f) => f == null ? "<td></td>"
    : `<td class="${f.points > 0 ? "ok" : "miss"}" title="got ${esc(JSON.stringify(f.got))}">${f.points}</td>`;
  const top = Object.entries(b).filter(([k, v]) => k !== "positions" && v && typeof v === "object" && "points" in v);
  const head = `<tr><th>Position</th>${FIELDS.map((f) => `<th>${f.replace(/_/g, " ")}</th>`).join("")}<th>Σ</th></tr>`;
  const rows = (b.positions || []).map((p) =>
    `<tr><th>${esc(p.position)}</th>${FIELDS.map((f) => cell(p[f])).join("")}<td><b>${p.points}</b></td></tr>`).join("");
  return `<div class="tables">
    <table><tr><th>Field</th><th>Points</th></tr>${top.map(([k, v]) => `<tr><th>${k.replace(/_/g, " ")}</th>${cell(v)}</tr>`).join("")}</table>
    <table>${head}${rows}</table></div>`;
}

function renderRun(run) {
  const s = state(run);
  const title = run.label || `package ${run.package.sha256.slice(0, 8)}`;
  const quality = run.has_answer && run.score
    ? `<span class="pill ${run.score.eligible ? (run.score.quality >= 50 ? "green" : "amber") : "red"}">Q ${run.score.quality}${run.score.eligible ? "" : " · ineligible"}</span>`
    : run.finished_at ? `<span class="pill red">${esc(run.failure_class || run.status)}</span>` : `<span class="pill blue">${s}</span>`;
  const queue = run.queue_position != null ? ` · queue #${run.queue_position}` : "";
  const cost = run.cost_micro_usd / 1e6;
  return `<div class="run ${open.has(run.run_id) ? "open" : ""}" data-id="${run.run_id}">
    <div class="row">
      ${ICONS[s]}
      <div>
        <div class="title">${esc(title)}</div>
        <div class="meta"><span class="mono">${run.run_id}</span> · ${run.kind === "rehearsal" ? "test run" : esc(run.kind)} · ${ago(run.created_at)}${queue}</div>
      </div>
      <div class="metrics">
        ${quality}
        <span title="run time">⏱ ${clock(seconds(run))}</span>
        <span title="LLM cost">${dollars(run.cost_micro_usd)}</span>
        <span title="cost × time">${(Math.max(cost, 0.01) * Math.max(seconds(run), 1)).toFixed(0)} $·s</span>
      </div>
    </div>
    <div class="details">
      ${run.error ? `<div class="error">${esc(run.error)}</div>` : ""}
      <div class="kv">
        <span>${run.calls} model calls</span>
        <span>${(run.input_tokens / 1e6).toFixed(2)} M in · ${(run.output_tokens / 1e3).toFixed(0)} k out</span>
        <span class="mono">package ${run.package.sha256.slice(0, 12)} · ${run.package.files} files</span>
        <a href="https://ehl-challenge.atira.ai/runs/${run.run_id}" target="_blank">run page ↗</a>
      </div>
      ${breakdown(run)}
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById("filter").value.toLowerCase();
  const kind = document.getElementById("kind").value;
  const shown = runs.filter((r) => (!kind || r.kind === kind)
    && (!q || [r.label, r.run_id, r.error, r.failure_class].some((v) => String(v ?? "").toLowerCase().includes(q))));
  document.getElementById("count").textContent = `${shown.length} runs`;
  document.getElementById("runs").innerHTML = shown.map(renderRun).join("") || '<div class="empty">No runs yet.</div>';
  renderStats();
  renderTrend();
}

async function load() {
  try {
    runs = await (await fetch("api/runs")).json();
    document.getElementById("updated").textContent = `updated ${new Date().toLocaleTimeString()} · refreshes every 15 s`;
    render();
  } catch (error) {
    document.getElementById("updated").textContent = `update failed: ${error}`;
  }
}

document.getElementById("runs").addEventListener("click", (event) => {
  const run = event.target.closest(".run");
  if (!run || event.target.closest("a")) return;
  open.has(run.dataset.id) ? open.delete(run.dataset.id) : open.add(run.dataset.id);
  run.classList.toggle("open");
});
document.getElementById("filter").addEventListener("input", render);
document.getElementById("kind").addEventListener("change", render);
load();
setInterval(load, 15000);
setInterval(render, 1000);
</script>
</body>
</html>
